[package]
name = "tattile"
version = "0.1.0"
edition = "2024"
description = "A native macOS app to practice clear, correct English writing, with feedback from Claude and Grok."
license = "MIT"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
directories = "6.0.0"
eframe = "0.37.0"
egui = "0.37.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3.5.0", features = ["json"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7.0"

[profile.release]
lto = "thin"
strip = true

# Keep debug builds of egui fast enough to type in.
[profile.dev.package."*"]
opt-level = 2
